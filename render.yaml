services:
  - type: web
    name: agrico-backend
    runtime: node
    rootDir: backend
    # Install ALL deps (including devDependencies: typescript, @types/*, prisma CLI)
    # then generate Prisma Client types before running tsc.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
